<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Medtronic Clinical Dashboard{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        
        .status-normal { color: #28a745; }
        .status-warning { color: #ffc107; }
        .status-danger { color: #dc3545; }
        
        .metric-card {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            margin: 10px 0;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .patient-row:hover {
            background-color: #f8f9fa;
            cursor: pointer;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-3">
                <div class="text-center mb-4">
                    <i class="fas fa-heartbeat fa-3x mb-3"></i>
                    <h4>Medtronic</h4>
                    <p class="small">Clinical Dashboard</p>
                </div>
                
                <nav class="nav flex-column">
                    <a class="nav-link text-white" href="/">
                        <i class="fas fa-users me-2"></i> Patients
                    </a>
                    <a class="nav-link text-white" href="#" onclick="showReports()">
                        <i class="fas fa-chart-bar me-2"></i> Reports
                    </a>
                    <a class="nav-link text-white" href="#" onclick="showAlerts()">
                        <i class="fas fa-exclamation-triangle me-2"></i> Alerts
                    </a>
                </nav>
                
                <div class="mt-auto">
                    <small class="text-white-50">
                        <i class="fas fa-user me-1"></i> cubit104<br>
                        <i class="fas fa-clock me-1"></i> {{ current_time }}
                    </small>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-10 p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
